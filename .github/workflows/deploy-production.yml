name: Deploy to Production

on:
  push:
    branches: [main]

env:
  GCP_PROJECT_ID: project-dfd217c3-6aac-4df9-ba6
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/project-dfd217c3-6aac-4df9-ba6/cardboard-ai-backend/base-backend:latest
  SERVICE: base-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker compose -f docker-compose.production.yml build
          docker compose -f docker-compose.production.yml push

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --session-affinity \
            --timeout 3600 \
            --min-instances=1 \
            --no-use-http2 \
            --set-env-vars="NODE_ENV=production" \
            --set-env-vars="REDIS_HOST=${{ secrets.REDIS_HOST }}" \
            --set-env-vars="AWS_S3_ACCESS_KEY=${{ secrets.AWS_S3_ACCESS_KEY }}" \
            --set-env-vars="AWS_S3_SECRET_KEY=${{ secrets.AWS_S3_SECRET_KEY }}" \
            --set-env-vars="AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}" \
            --set-env-vars="AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" \
            --set-env-vars="REDIS_PORT=${{ secrets.REDIS_PORT }}" \
            --set-env-vars="REDIS_USERNAME=${{ secrets.REDIS_USERNAME }}" \
            --set-env-vars="REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" \
            --set-env-vars="JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars="EXPIRE_ACCESS_TOKEN=${{ secrets.EXPIRE_ACCESS_TOKEN }}" \
            --set-env-vars="EXPIRE_REFRESH_TOKEN=${{ secrets.EXPIRE_REFRESH_TOKEN }}" \
            --set-env-vars="GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
            --set-env-vars="GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --set-env-vars="GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}" \
            --set-env-vars="FRONTEND_URL=${{ secrets.FRONTEND_URL }}" \
            --set-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --set-env-vars="AI_DEFAULT_PROVIDER=${{ secrets.AI_DEFAULT_PROVIDER }}" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}"

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)"