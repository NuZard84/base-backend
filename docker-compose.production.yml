# Production: build and push to GCP Artifact Registry for Cloud Run
# Usage:
#   docker compose -f docker-compose.production.yml build
#   docker compose -f docker-compose.production.yml push
# Or run: ./scripts/deploy-production.sh

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    # GCP Artifact Registry (us-central1, base-backend-migr01)
    image: us-central1-docker.pkg.dev/base-backend-migr01/base-backend-2026/base-backend:latest
